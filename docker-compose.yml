services:
  dev:
    build:
      context: .
      args:
        ENV_MODE: dev
    container_name: olex2rtz-dev
    ports:
      - "${DEV_BIND_PORT:-5000}:${APP_PORT:-5000}"
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./cache:/app/cache
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-5000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      WORLDTIDES_API_KEY: ${WORLDTIDES_API_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.olex2rtz-dev.rule=Host(`${TRAEFIK_DEV_HOST:?TRAEFIK_DEV_HOST is required}`)"
      - "traefik.http.routers.olex2rtz-dev.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.olex2rtz-dev.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER is required}"
      - "traefik.http.routers.olex2rtz-dev.middlewares=${TRAEFIK_DEV_MIDDLEWARES:?TRAEFIK_DEV_MIDDLEWARES is required}"
      - "traefik.http.services.olex2rtz-dev.loadbalancer.server.port=${APP_PORT:-5000}"
    networks:
      - web
    restart: unless-stopped

  prod:
    build:
      context: .
      args:
        ENV_MODE: prod
    container_name: olex2rtz
    volumes:
      - ./cache:/app/cache
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-5000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      WORLDTIDES_API_KEY: ${WORLDTIDES_API_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.olex2rtz.rule=Host(`${TRAEFIK_PROD_HOST:?TRAEFIK_PROD_HOST is required}`)"
      - "traefik.http.routers.olex2rtz.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.olex2rtz.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER is required}"
      - "traefik.http.services.olex2rtz.loadbalancer.server.port=${APP_PORT:-5000}"
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true